<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>MyTicket</title>
        <link rel="stylesheet" href="style.css">
    </head>
    <body>
        <header class="app-header">
            <h1>MyTicket</h1>
        </header>

        <main class="ticketing-layout">
            <section class="map-section" aria-label="Venue Map Section">
                <h2>Venue: E Large Auditorium</h2>

                <div class="map-legend">
                    <span class="legend-item"><span class="box-available"></span>Available</span>
                    <span class="legend-item"><span class="box-inspected"></span>Inspected</span>
                    <span class="legend-item"><span class="box-in-cart"></span>In Cart</span>
                    <span class="legend-item"><span class="box-unavailable"></span>Unavailable</span>
                </div>

                <div class="map-viewport" id="map-viewport">
                    <div class="map-ui-overlay">
        
                        <!--movements-->
                        <div class="d-pad">
                            <button id="btn-move-up" class="ui-btn up" aria-label="Move Up">
                                <svg viewBox="0 0 24 24" width="20" height="20" stroke="currentColor" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"><path d="M12 19V5M5 12l7-7 7 7"/></svg>
                            </button>
                            <button id="btn-move-left" class="ui-btn left" aria-label="Move Left">
                                <svg viewBox="0 0 24 24" width="20" height="20" stroke="currentColor" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"><path d="M19 12H5M12 19l-7-7 7-7"/></svg>
                            </button>
                            <button id="btn-reset-view" class="ui-btn center-reset" aria-label="Reset View">
                                <svg viewBox="0 0 24 24" width="16" height="16" stroke="currentColor" stroke-width="2" fill="none"><circle cx="12" cy="12" r="6"/></svg>
                            </button>
                            <button id="btn-move-right" class="ui-btn right" aria-label="Move Right">
                                <svg viewBox="0 0 24 24" width="20" height="20" stroke="currentColor" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14M12 5l7 7-7 7"/></svg>
                            </button>
                            <button id="btn-move-down" class="ui-btn down" aria-label="Move Down">
                                <svg viewBox="0 0 24 24" width="20" height="20" stroke="currentColor" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"><path d="M12 5v14M19 12l-7 7-7-7"/></svg>
                            </button>
                        </div>
                        <!--zoom buttons-->
                        <div class="zoom-pad">
                            <button id="btn-zoom-in" class="ui-btn zoom" aria-label="Zoom In">
                                <svg viewBox="0 0 24 24" width="20" height="20" stroke="currentColor" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"><line x1="12" y1="5" x2="12" y2="19"></line><line x1="5" y1="12" x2="19" y2="12"></line></svg>
                            </button>
                            <div class="zoom-divider"></div>
                            <button id="btn-zoom-out" class="ui-btn zoom" aria-label="Zoom Out">
                                <svg viewBox="0 0 24 24" width="20" height="20" stroke="currentColor" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"><line x1="5" y1="12" x2="19" y2="12"></line></svg>
                            </button>
                        </div>
                    </div>
                    <div class="map-container" id="venue-container">

                        <div class="balcony-level">
                            <div class="seating-block" id="zone-amphitheater" data-zone="Balcony Amphitheater"><!-- JS will inject balcony seat <button> elements here --></div>
                        </div>

                        <div class="main-floor-seating">

                            <div class="seating-row rear-row">
                                <div class="seating-block" id="zone-rear-left" data-zone="Rear Left"></div>
                                <div class="seating-block" id="zone-rear-center" data-zone="Rear Center"></div>
                                <div class="seating-block" id="zone-rear-right" data-zone="Rear Right"></div>
                            </div>
                        

                            <div class="aisle"></div>

                            <div class="seating-row front-row">
                                <div class="seating-block" id="zone-front-left" data-zone="Front Left"></div>
                                <div class="seating-block" id="zone-front-center" data-zone="Front Center"></div>
                                <div class="seating-block" id="zone-front-right" data-zone="Front Right"></div>
                            </div>

                        </div>
                        <div class="stage-area">
                          <div class="stage-shape">STAGE</div>
                        </div>

                    </div>
                </div>

            </section>

            <aside class="sidebar-section" aria-label="Ticketing Sidebar">

                <div class="panel inspection-panel" id="inspection-panel">
                    <h2>Seat Details</h2>

                    <div class="seat-info-display" id="seat-info-display">
                        <p class="placeholder">Click on an available seat on the map to inspect</p>

                        <div class="active-seat-details" id="active-seat-details" hidden>
                            <p><strong>Zone:</strong><span id="detail-zone">-</span></p>
                            <p><strong>Row:</strong><span id="detail-row">-</span></p>
                            <p><strong>Seat:</strong><span id="detail-seat">-</span></p>
                            <p class="price-tag"><strong>Price:</strong> $<span id="detail-price">0.00</span></p>
                        </div>
                    </div>

                    <button id="btn-add-to-cart" class="primary-action-btn" disabled>ADD TO CART</button>
                </div>

                <div class="panel cart-panel" id="cart-panel">
                    <h2>Your Cart</h2>

                    <div class="cart-items-container">
                        <ul id="cart-items-list" class="cart-items-list">
                            <li class="empty-cart-message">
                                Your cart is empty.
                            </li>
                        </ul>
                    </div>

                    <div class="cart-footer">
                        <div class="total-row">
                            <span>Total:</span>
                            <span class="total-price">$<span id="cart-total">0.00</span></span>
                        </div>
                        <button id="btn-clear-cart" class="clear-cart-btn" style="margin-bottom: 8px; background-color: #dc3545; color: white; width: 100%; padding: 0.75rem; border: none; border-radius: 6px; cursor: pointer; font-weight: 600;">Remove Seats</button>
                        <button id="btn-checkout" class="checkout-btn" disabled>Proceed to Checkout</button>
                    </div>
                </div>
            </aside>
        </main>

        <script src="app.js"></script>
    </body>
</html>
